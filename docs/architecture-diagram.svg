<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#edf5f0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6b52"/>
      <stop offset="1" stop-color="#143f35"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5576e8"/>
      <stop offset="1" stop-color="#7358c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173c30" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5c8875"/>
    </marker>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#183c32}.subtitle{font:400 20px Arial,sans-serif;fill:#648077}.section{font:700 16px Arial,sans-serif;letter-spacing:2.3px;fill:#668178}.boxTitle{font:700 23px Arial,sans-serif;fill:#183c32}.boxBody{font:400 17px Arial,sans-serif;fill:#61796f}.whiteTitle{font:700 23px Arial,sans-serif;fill:white}.whiteBody{font:400 17px Arial,sans-serif;fill:#deeee7}.pill{font:700 14px Arial,sans-serif;fill:#326b56}.small{font:400 15px Arial,sans-serif;fill:#70887e}.flow{fill:none;stroke:#5c8875;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#9cb7aa;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <circle cx="1660" cy="95" r="210" fill="#d9ebe0" opacity=".55"/>
  <circle cx="85" cy="1115" r="240" fill="#dce9f7" opacity=".45"/>

  <text x="90" y="82" class="section">CLIMATEREVIEW AI · ALL THINGS AGENTIC</text>
  <text x="90" y="139" class="title">Agentic Scientific Review Architecture</text>
  <text x="90" y="178" class="subtitle">Evidence-grounded passage analysis with explicit human authority at every decision point</text>

  <!-- Reviewer -->
  <g filter="url(#shadow)">
    <rect x="90" y="270" width="245" height="210" rx="28" fill="white" stroke="#d9e7de" stroke-width="2"/>
    <circle cx="212" cy="326" r="34" fill="#dcefe3"/>
    <circle cx="212" cy="316" r="12" fill="#39735c"/>
    <path d="M188 350 Q212 329 236 350" fill="#39735c"/>
    <text x="212" y="399" text-anchor="middle" class="boxTitle">Human Reviewer</text>
    <text x="212" y="430" text-anchor="middle" class="boxBody">Selects · evaluates · edits</text>
    <text x="212" y="457" text-anchor="middle" class="boxBody">accepts or rejects</text>
  </g>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="445" y="235" width="390" height="280" rx="28" fill="white" stroke="#cfe1d6" stroke-width="2"/>
    <rect x="445" y="235" width="390" height="63" rx="28" fill="url(#hero)"/>
    <rect x="445" y="270" width="390" height="28" fill="url(#hero)"/>
    <text x="475" y="275" class="whiteTitle">Reviewer Workspace</text>
    <rect x="476" y="328" width="145" height="127" rx="13" fill="#edf3ef" stroke="#d6e3da"/>
    <rect x="638" y="328" width="165" height="127" rx="13" fill="#f7faf8" stroke="#d6e3da"/>
    <text x="548" y="367" text-anchor="middle" class="pill">PDF.js</text>
    <text x="548" y="394" text-anchor="middle" class="small">Page + passage</text>
    <text x="548" y="419" text-anchor="middle" class="small">text selection</text>
    <text x="721" y="367" text-anchor="middle" class="pill">Review panel</text>
    <text x="721" y="394" text-anchor="middle" class="small">Issue · evidence</text>
    <text x="721" y="419" text-anchor="middle" class="small">draft · confidence</text>
    <text x="475" y="487" class="boxBody">Next.js · React · TypeScript · Cloud Run</text>
  </g>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="970" y="235" width="390" height="280" rx="28" fill="white" stroke="#cfe1d6" stroke-width="2"/>
    <rect x="970" y="235" width="390" height="63" rx="28" fill="#285c4b"/>
    <rect x="970" y="270" width="390" height="28" fill="#285c4b"/>
    <text x="1000" y="275" class="whiteTitle">Review Orchestrator API</text>
    <rect x="1002" y="329" width="326" height="44" rx="12" fill="#edf7f0"/>
    <text x="1023" y="357" class="pill">1 · Validate document, page and selection</text>
    <rect x="1002" y="383" width="326" height="44" rx="12" fill="#edf7f0"/>
    <text x="1023" y="411" class="pill">2 · Retrieve bounded page context</text>
    <rect x="1002" y="437" width="326" height="44" rx="12" fill="#edf7f0"/>
    <text x="1023" y="465" class="pill">3 · Enforce structured review schema</text>
    <text x="1002" y="505" class="boxBody">FastAPI · Google GenAI SDK · Cloud Run</text>
  </g>

  <!-- Human-flow arrows -->
  <path d="M335 355 C380 355 394 355 435 355" class="flow"/>
  <text x="385" y="339" text-anchor="middle" class="small">select passage</text>
  <path d="M835 375 C890 375 906 375 960 375" class="flow"/>
  <text x="898" y="354" text-anchor="middle" class="small">page + text</text>
  <path d="M970 446 C915 446 892 446 838 446" class="dash"/>
  <text x="902" y="478" text-anchor="middle" class="small">structured suggestion</text>

  <!-- Data plane -->
  <text x="90" y="620" class="section">EVIDENCE &amp; MODEL PLANE · GOOGLE CLOUD</text>
  <g filter="url(#shadow)">
    <rect x="90" y="660" width="320" height="225" rx="26" fill="white" stroke="#d6e3da" stroke-width="2"/>
    <rect x="118" y="694" width="68" height="80" rx="12" fill="#e7f0fa"/>
    <path d="M135 713 H169 M135 728 H169 M135 743 H160" stroke="#477aa5" stroke-width="5" stroke-linecap="round"/>
    <text x="210" y="720" class="boxTitle">Private GCS</text>
    <text x="210" y="748" class="boxBody">Source documents</text>
    <text x="118" y="810" class="boxBody">Uniform access · public access prevention</text>
    <text x="118" y="841" class="boxBody">Confidential metadata · no-store caching</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="660" width="350" height="225" rx="26" fill="white" stroke="#d6e3da" stroke-width="2"/>
    <ellipse cx="577" cy="715" rx="31" ry="13" fill="#dbece2" stroke="#3c785f" stroke-width="3"/>
    <path d="M546 715 V761 C546 779 608 779 608 761 V715" fill="#dbece2" stroke="#3c785f" stroke-width="3"/>
    <ellipse cx="577" cy="761" rx="31" ry="13" fill="#dbece2" stroke="#3c785f" stroke-width="3"/>
    <text x="632" y="720" class="boxTitle">BigQuery</text>
    <text x="632" y="748" class="boxBody">Page-aware evidence</text>
    <text x="550" y="810" class="boxBody">Documents + deterministic chunk IDs</text>
    <text x="550" y="841" class="boxBody">Embeddings + cosine vector retrieval</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="660" width="380" height="225" rx="26" fill="url(#gemini)"/>
    <path d="M1032 708 L1044 738 L1074 750 L1044 762 L1032 792 L1020 762 L990 750 L1020 738 Z" fill="#e8edff"/>
    <text x="1090" y="720" class="whiteTitle">Vertex AI · Gemini 3.7</text>
    <text x="1090" y="750" class="whiteBody">Scientific review reasoning</text>
    <text x="1014" y="810" class="whiteBody">Grounded prompt · JSON response contract</text>
    <text x="1014" y="841" class="whiteBody">Issue · evidence · resolution · confidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1470" y="660" width="240" height="225" rx="26" fill="white" stroke="#d8e0f1" stroke-width="2"/>
    <circle cx="1590" cy="720" r="38" fill="#e9eefb"/>
    <path d="M1563 720 H1617 M1590 693 V747 M1571 701 L1609 739 M1609 701 L1571 739" stroke="#596fb4" stroke-width="4" opacity=".8"/>
    <text x="1590" y="797" text-anchor="middle" class="boxTitle">text-embedding-005</text>
    <text x="1590" y="829" text-anchor="middle" class="boxBody">Retrieval vectors</text>
    <text x="1590" y="855" text-anchor="middle" class="boxBody">document + query tasks</text>
  </g>

  <!-- Data connections -->
  <path d="M410 770 C455 770 472 770 510 770" class="flow"/>
  <text x="463" y="751" text-anchor="middle" class="small">extract + chunk</text>
  <path d="M870 735 C916 705 931 705 970 725" class="flow"/>
  <text x="922" y="687" text-anchor="middle" class="small">bounded context</text>
  <path d="M1470 790 C1425 790 1410 790 1370 790" class="dash"/>
  <text x="1418" y="770" text-anchor="middle" class="small">vectors</text>
  <path d="M1510 660 C1480 600 1350 585 1220 650" class="dash"/>
  <path d="M1165 650 C1165 600 1165 570 1165 525" class="flow"/>
  <text x="1190" y="590" class="small">reasoning request</text>

  <!-- Output boundary -->
  <g>
    <rect x="90" y="1000" width="1620" height="125" rx="25" fill="#173f34"/>
    <circle cx="145" cy="1062" r="28" fill="#d9ede3"/>
    <path d="M132 1062 L142 1072 L160 1051" fill="none" stroke="#24664e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="1049" class="whiteTitle">Human approval boundary</text>
    <text x="195" y="1082" class="whiteBody">Browser-local draft queue · edit / reject / accept · CSV export</text>
    <rect x="1265" y="1030" width="405" height="65" rx="16" fill="#285c4b" stroke="#5f8e7b"/>
    <text x="1468" y="1057" text-anchor="middle" class="whiteTitle">No automatic portal submission</text>
    <text x="1468" y="1081" text-anchor="middle" class="whiteBody">No credentials stored · reviewer retains authority</text>
  </g>

  <text x="1710" y="1170" text-anchor="end" class="small">Public demo: public-domain or synthetic content only</text>
</svg>
